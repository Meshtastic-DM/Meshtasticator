# Topology Generation Parameters
# Use this file with: python generate_topology.py --input-params topology_params.yaml

# Node counts
dm: 11          # Number of Direct Message nodes
sensor: 11      # Number of Sensor nodes
router: 2       # Number of Router nodes

# Coordinate bounds (meters)
x_low: -3500
x_high: 3500
y_low: -3500
y_high: 3500

# Z coordinates (elevation)
z_default: 1.0   # For DM and Sensor nodes
router_z: 2.0    # For Router nodes (elevated)

# Node placement
min_distance: 600.0   # Minimum distance between nodes (meters)
max_distance: null   # Maximum distance from Control Center (0,0) in meters
                     # Set to null for no limit, or a number like 1500 to constrain area

# Output configuration
output: "out/config.yaml"  # Output file path
quiet: false               # Set to true to suppress statistics

# Random seed (optional, set to null for random)
# Use a specific number for reproducible topology
seed: null

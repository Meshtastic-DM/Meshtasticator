syntax = "proto3";

package meshtastic;

option java_outer_classname = "SDNProtos";
option optimize_for = LITE_RUNTIME;
option go_package = "github.com/meshtastic/go/generated";

/**
 * SDN (Software Defined Networking) protocol messages
 */

/**
 * SDN Controller Announcement - broadcast periodically by SDN controller
 */
message SDNAnnouncement {
    /**
     * HMAC hash for authentication (16 bytes)
     */
    bytes hmac_hash = 1;

    /**
     * Curve25519 public key (32 bytes) for the SDN controller
     */
    bytes public_key = 2;

    /**
     * Sequence number for announcements (increments with each announcement)
     */
    uint32 sequence_num = 3;

    /**
     * Unix timestamp when announcement was created
     */
    fixed32 timestamp = 4;
}

/**
 * Route update sent to SDN controller when AODV route is learned
 */
message SDNRouteUpdate {
    /**
     * Route destination node (32-bit full node number)
     */
    fixed32 destination = 1;

    /**
     * Next hop node (8-bit last byte)
     */
    uint32 next_hop = 2;

    /**
     * Number of hops to destination
     */
    uint32 hop_count = 3;

    /**
     * AODV destination sequence number
     */
    uint32 dest_seq_num = 4;

    /**
     * Unix timestamp when route was learned
     * Reporter node is available in MeshPacket.from field
     */
    fixed32 timestamp = 5;
}

/**
 * Route command sent by SDN controller to activate a backup path
 * Tells a node to switch its active route for a destination to use a specific next hop
 */
message SDNRouteCommand {
    /**
     * Destination node to switch route for (32-bit full node number)
     */
    fixed32 destination = 1;

    /**
     * Next hop to activate as primary path (8-bit last byte)
     */
    uint32 next_hop = 2;
}

/**
 * Route installation command sent by SDN controller to start node
 * Initiates cascading route setup through hop-by-hop forwarding
 */
message SDNRouteInstall {
    /**
     * Final destination node (32-bit full node number)
     */
    fixed32 destination = 1;

    /**
     * Packed hop path: 8 bytes, each byte is one hop (1-byte node ID)
     * LSB = first hop, zero bytes mark end of path
     */
    fixed64 hop_path = 2;

    /**
     * Installation ID for tracking (0-255)
     */
    uint32 install_id = 3;
}

/**
 * Route set message propagated hop-by-hop from start to destination
 * Each intermediate node installs forward and reverse routes
 */
message SDNRouteSet {
    /**
     * Final destination node (32-bit full node number)
     */
    fixed32 destination = 1;

    /**
     * Packed hop path: remaining hops to traverse
     * Path is shifted at each hop (first hop removed)
     */
    fixed64 hop_path = 2;

    /**
     * Installation ID for tracking (0-255)
     */
    uint32 install_id = 3;
}

/**
 * Confirmation sent by destination back to controller
 * Reports success or failure of route installation
 */
message SDNRouteSetConfirm {
    /**
     * Destination node that was reached (32-bit full node number)
     */
    fixed32 destination = 1;

    /**
     * Installation ID to correlate with original request
     */
    uint32 install_id = 2;

    /**
     * True if route installation succeeded
     */
    bool success = 3;

    /**
     * Optional error message if installation failed
     */
    string error_msg = 4;
}

/**
 * SDN message wrapper
 */
message SDN {
    /**
     * The actual SDN message payload
     */
    oneof payload_variant {
        SDNAnnouncement announcement = 1;
        SDNRouteUpdate route_update = 2;
        SDNRouteCommand route_command = 3;
        SDNRouteInstall route_install = 4;
        SDNRouteSet route_set = 5;
        SDNRouteSetConfirm route_set_confirm = 6;
    }
}
